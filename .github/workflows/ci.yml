name: CI - Tests y Regla de Arquitectura

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sw708
          POSTGRES_PASSWORD: sw708_lab
          POSTGRES_DB: boletos_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U sw708 -d boletos_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: "postgres://sw708:sw708_lab@localhost:5433/boletos_db"

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar regla de arquitectura
        run: npm run lint:arquitectura

      - name: Crear tabla de pruebas
        run: node scripts/crear-tabla.mjs

      - name: Ejecutar pruebas
        run: npm test

      - name: Verificar tipos
        run: npm run typecheck
